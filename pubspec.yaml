name: my_movie
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^9.1.1
  get_it: ^7.6.0

  # Navigation & Network
  go_router: ^14.0.0
  dio: ^5.4.0

  # Backend & Auth
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.0
  firebase_crashlytics:
  firebase_analytics:
  firebase_remote_config:

  # Local Persistence
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # UI, Fonts & Utilities
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  youtube_player_iframe: ^5.1.3
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.0
  flutter_dotenv: ^5.1.0
  http: ^1.6.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  showcaseview: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

  adaptive_icon_background: "#0A0A0D"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - .env
  fonts:
    - family: sarkar
      fonts:
        - asset: assets/fonts/sarkar.ttf

flutter_native_splash:
  color: "#07090F"

  image: assets/icon.png

  android_12:
    image: assets/icon.png
    color: "#07090F"

  android: true
  ios: true

  fullscreen: true
